<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ソフトテニス戦績</title>
<meta name="theme-color" content="#0b8a5f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="テニス戦績">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<header class="top">
  <div class="top-in">
    <h1 id="app-title">ソフトテニス部 戦績管理</h1>
    <button class="icon-btn" data-act="openSettings" aria-label="設定">⚙</button>
  </div>
  <nav class="tabs" id="tabs">
    <button data-tab="entry" class="on">試合入力</button>
    <button data-tab="stats">戦績</button>
    <button data-tab="daily">日別</button>
    <button data-tab="players">選手</button>
    <button data-tab="pdf">PDF取込</button>
  </nav>
</header>

<main>
  <div id="sync" class="sync" hidden></div>

  <!-- 合言葉 -->
  <section id="login" class="panel" hidden>
    <div class="card">
      <h2>部の合言葉を入れてください</h2>
      <p class="muted">一度入れると、この端末では次から聞かれません。</p>
      <input id="login-key" type="password" autocomplete="current-password" placeholder="合言葉">
      <button class="btn primary wide" data-act="login">はじめる</button>
      <p id="login-msg" class="err"></p>
    </div>
  </section>

  <!-- 試合入力 -->
  <section id="p-entry" class="panel">
    <div id="e-from-pdf"></div>
    <div class="card">
      <div class="row2">
        <label class="fld"><span>試合日</span><input id="e-date" type="date"></label>
        <div class="fld"><span>種目</span><div class="seg" id="e-event"></div></div>
      </div>
      <label class="fld"><span>大会名・メモ（任意）</span><input id="e-tournament" placeholder="例：練習試合" autocomplete="off"></label>
      <div class="chips small" id="e-tournaments"></div>
    </div>

    <div class="card side mine">
      <h3>自分たち</h3>
      <div class="seg" id="e-gender"></div>
      <div id="e-me"></div>
      <div id="e-partner"></div>
    </div>

    <div class="card side opp">
      <h3>相手</h3>
      <div id="e-school"></div>
      <div id="e-opp"></div>
    </div>

    <div class="card">
      <h3>スコア</h3>
      <div id="e-score"></div>
    </div>

    <div class="submit-bar">
      <div id="e-summary" class="summary"></div>
      <button class="btn primary wide big" data-act="submit">登録する</button>
    </div>

    <details class="card" id="e-recent-box">
      <summary>この端末で入力した試合（確認・取り消し）</summary>
      <div id="e-recent"></div>
    </details>
  </section>

  <!-- 戦績 -->
  <section id="p-stats" class="panel" hidden>
    <div class="card">
      <div class="seg" id="s-mode"></div>
      <div class="seg" id="s-gender"></div>
      <div class="seg" id="s-school"></div>
      <div class="seg" id="s-period"></div>
      <div class="row2" id="s-range" hidden>
        <label class="fld"><span>から</span><input id="s-from" type="date"></label>
        <label class="fld"><span>まで</span><input id="s-to" type="date"></label>
      </div>
      <div class="row2">
        <label class="fld"><span>大会</span><select id="s-tournament"></select></label>
        <label class="fld"><span>名前・学校で絞り込み</span><input id="s-q" type="search" placeholder="例：源、小松"></label>
      </div>
      <label class="check"><input type="checkbox" id="s-abort"> 途中で終わった試合も勝率に入れる</label>
    </div>
    <div class="card flush"><div id="s-table"></div></div>
  </section>

  <!-- 日別 -->
  <section id="p-daily" class="panel" hidden>
    <div class="card no-print">
      <label class="fld"><span>日付</span><input id="d-date" type="date"></label>
      <div class="chips small" id="d-dates"></div>
      <button class="btn" data-act="print">🖨 印刷する</button>
    </div>
    <div id="d-list"></div>
  </section>

  <!-- 選手 -->
  <section id="p-players" class="panel" hidden>
    <div class="card">
      <h3>選手を追加</h3>
      <label class="fld"><span>氏名</span><input id="pl-name" placeholder="例：山田（名簿は名字だけでも大丈夫）" autocomplete="off"></label>
      <div class="fld"><span>性別</span><div class="seg" id="pl-gender"></div></div>
      <div class="fld"><span>学年</span><div class="seg" id="pl-grade"></div></div>
      <label class="fld"><span>学校</span><input id="pl-school" list="school-list" autocomplete="off"></label>
      <datalist id="school-list"></datalist>
      <button class="btn primary wide" data-act="addPlayer">登録する</button>
    </div>
    <div class="card">
      <h3>名簿</h3>
      <div class="row2">
        <label class="fld"><span>学校</span><select id="pl-filter-school"></select></label>
        <div class="fld"><span>性別</span><div class="seg" id="pl-filter-gender"></div></div>
      </div>
      <label class="check"><input type="checkbox" id="pl-show-retired"> 引退した選手も表示</label>
      <div id="pl-list"></div>
    </div>
    <div class="card" id="admin-box"></div>
  </section>

  <!-- PDF取込 -->
  <section id="p-pdf" class="panel" hidden>
    <div class="card">
      <p class="muted">大会のトーナメント表・結果の PDF を選ぶと、自校のペアを探して一覧にします。「この試合を入力」を押すと、大会名・日付・ペア（相手も選べば相手も）が入った状態で試合入力に移ります。</p>
      <label class="fld"><span>PDFファイル</span><input id="pdf-file" type="file" accept="application/pdf"></label>
      <div class="row2">
        <label class="fld"><span>大会名（PDF から自動で入ります）</span><input id="pdf-tournament"></label>
        <label class="fld"><span>試合日</span><input id="pdf-date" type="date"></label>
      </div>
      <p id="pdf-msg" class="muted"></p>
    </div>
    <div id="pdf-list"></div>
  </section>
</main>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-in">
    <button class="icon-btn close" data-act="closeSheet" aria-label="閉じる">✕</button>
    <div id="sheet-body"></div>
  </div>
</div>
<div id="toast" class="toast" hidden></div>

<script src="config.js?v=2"></script>
<script src="app.js?v=2"></script>
</body>
</html>
